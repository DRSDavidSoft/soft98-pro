name: "☠️ Soft98 Pro · Build and Test"
run-name: "☠️ Build · ${{ github.ref_name }} · ${{ github.event_name }}"

on:
  pull_request:
  push:
    branches: [main, develop]
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: soft98-pro-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: "🛡️ Runtime · Packages · Browser"
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      ARTIFACT_RETENTION_DAYS: 14
      FORCE_COLOR: "1"
    steps:
      - name: "📥 Check out source"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: "🟢 Install Node.js"
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: "📦 Restore locked dependencies"
        run: npm ci --ignore-scripts

      - name: "🔐 Audit critical dependencies"
        run: npm audit --audit-level=critical

      - name: "🌐 Install Chrome for Testing and ChromeDriver"
        id: browser
        uses: browser-actions/setup-chrome@48ad923757ca74d66703209fe939badbdf80f2f4 # v2.2.0
        with:
          install-chromedriver: true

      - name: "✅ Build and run acceptance suite"
        env:
          CHROME_PATH: ${{ steps.browser.outputs.chrome-path }}
          SOFT98_QUEUE_CHROMEDRIVER: ${{ steps.browser.outputs.chromedriver-path }}
        run: npm run ci

      - name: "🧬 Verify PersianBlocker fixture"
        run: npm run check:persianblocker-upstream

      - name: "🧩 Upload Chromium package"
        id: chromium
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          path: dist/packages/soft98-pro-chromium-*.zip
          archive: false
          if-no-files-found: error
          retention-days: 14

      - name: "🦊 Upload Firefox package"
        id: firefox
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          path: dist/packages/soft98-pro-firefox-*.zip
          archive: false
          if-no-files-found: error
          retention-days: 14

      - name: "📜 Upload installable userscript"
        id: userscript
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          path: soft98-pro.user.js
          archive: false
          if-no-files-found: error
          retention-days: 14

      - name: "🔐 Upload checksums and build metadata"
        id: metadata
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: soft98-pro-build-metadata-${{ github.sha }}
          path: |
            dist/packages/soft98-pro-userscript-*.zip
            dist/release/latest.json
            dist/release/SHA256SUMS.txt
            dist/release/RELEASE-NOTES.md
          if-no-files-found: error
          retention-days: 14

      - name: "🧾 Publish branded build summary"
        if: always() && hashFiles('dist/release/latest.json') != ''
        env:
          JOB_STATUS: ${{ job.status }}
          CHROMIUM_ARTIFACT_URL: ${{ steps.chromium.outputs.artifact-url }}
          FIREFOX_ARTIFACT_URL: ${{ steps.firefox.outputs.artifact-url }}
          USERSCRIPT_ARTIFACT_URL: ${{ steps.userscript.outputs.artifact-url }}
          METADATA_ARTIFACT_URL: ${{ steps.metadata.outputs.artifact-url }}
        run: node tools/ci-summary.js build

  dependency-review:
    name: "🔐 Dependency review"
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: "📥 Check out source"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: "🔐 Review dependency changes"
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5
        with:
          fail-on-severity: critical
