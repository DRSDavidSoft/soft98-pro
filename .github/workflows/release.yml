name: "🏴‍☠️ Soft98 Pro Release"

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag matching package.json, for example v1.2.0"
        required: true
        type: string
      prerelease:
        description: "Publish as a prerelease"
        required: true
        default: false
        type: boolean

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: soft98-pro-release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    name: "🚀 Build and publish"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: "📥 Checkout"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "🟢 Setup Node.js"
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: "🏷️ Verify release version"
        id: version
        env:
          DISPATCH_TAG: ${{ github.event.inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          EXPECTED_TAG="v${PACKAGE_VERSION}"
          if [ -n "$DISPATCH_TAG" ]; then
            REQUESTED_TAG="$DISPATCH_TAG"
          elif [ "$REF_TYPE" = "tag" ]; then
            REQUESTED_TAG="$REF_NAME"
          else
            REQUESTED_TAG="$EXPECTED_TAG"
          fi
          if [ "$REQUESTED_TAG" != "$EXPECTED_TAG" ]; then
            echo "Requested tag $REQUESTED_TAG does not match package.json ($EXPECTED_TAG)." >&2
            exit 1
          fi
          EXISTING_SHA="$(git rev-list -n 1 "$EXPECTED_TAG" 2>/dev/null || true)"
          if [ -n "$EXISTING_SHA" ] && [ "$EXISTING_SHA" != "$GITHUB_SHA" ]; then
            echo "$EXPECTED_TAG already points to $EXISTING_SHA; bump package.json before publishing another main commit." >&2
            exit 1
          fi
          echo "tag=$EXPECTED_TAG" >> "$GITHUB_OUTPUT"
          echo "version=$PACKAGE_VERSION" >> "$GITHUB_OUTPUT"

      - name: "📦 Install locked dependencies"
        run: npm ci

      - name: "✅ Build and run acceptance tests"
        run: npm run ci

      - name: "🔏 Attest release artifacts"
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            soft98-pro.user.js
            dist/packages/*.zip
            dist/release/latest.json
            dist/release/SHA256SUMS.txt

      - name: "🚀 Publish GitHub Release"
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          PRERELEASE: ${{ github.event.inputs.prerelease || 'false' }}
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            ARGS=("$RELEASE_TAG" --title "☠️ Soft98 Pro $RELEASE_TAG" --generate-notes --target "$GITHUB_SHA")
            if [ "$PRERELEASE" = "true" ]; then ARGS+=(--prerelease); else ARGS+=(--latest); fi
            gh release create "${ARGS[@]}"
          fi
          gh release upload "$RELEASE_TAG" \
            dist/packages/soft98-pro-chromium-*.zip \
            dist/packages/soft98-pro-firefox-*.zip \
            dist/packages/soft98-pro-userscript-*.zip \
            soft98-pro.user.js \
            dist/release/latest.json \
            dist/release/SHA256SUMS.txt \
            --clobber

      - name: "🧾 Publish release summary"
        if: always() && hashFiles('dist/release/latest.json') != ''
        run: node tools/ci-summary.js release
