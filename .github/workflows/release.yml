name: "🏴‍☠️ Soft98 Pro · Release"
run-name: "🏴‍☠️ Release · ${{ github.event.inputs.tag || github.ref_name }} · ${{ github.event_name }}"

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag matching package.json, for example v1.2.0"
        required: true
        type: string
      prerelease:
        description: "Publish as a prerelease"
        required: true
        default: false
        type: boolean
      allow_missing_upstream:
        description: "Publish browser packages without the optional server artifact if live discovery is unavailable"
        required: true
        default: false
        type: boolean

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: soft98-pro-release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    name: "🚀 Verify · Attest · Publish"
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: "📥 Check out complete source history"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: "🟢 Install Node.js"
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: "🏷️ Verify release version"
        id: version
        env:
          DISPATCH_TAG: ${{ github.event.inputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          expected="v${version}"
          requested="$DISPATCH_TAG"
          if [[ "$requested" != "$expected" ]]; then
            echo "Requested tag $requested does not match package.json ($expected)." >&2
            exit 1
          fi
          existing_sha="$(git rev-list -n 1 "$expected" 2>/dev/null || true)"
          if [[ -n "$existing_sha" && "$existing_sha" != "$GITHUB_SHA" ]]; then
            echo "$expected already points to $existing_sha; update package.json before publishing another main commit." >&2
            exit 1
          fi
          echo "tag=$expected" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: "📦 Restore locked dependencies"
        run: npm ci --ignore-scripts

      - name: "✅ Build and run release acceptance suite"
        run: npm run ci

      - name: "🧬 Verify current Soft98 compatibility"
        id: upstream
        env:
          ALLOW_MISSING: ${{ inputs.allow_missing_upstream }}
        shell: bash
        run: |
          set -euo pipefail
          for page in \
            'https://soft98.ir/' \
            'https://soft98.ir/internet/remote-control/15737-anydesk-download.html'; do
            if node tools/check-soft98-upstream.js --check --page "$page"; then
              echo 'verified=true' >> "$GITHUB_OUTPUT"
              exit 0
            else
              status=$?
              if [[ "$status" != 3 ]]; then exit "$status"; fi
            fi
          done
          if [[ "$ALLOW_MISSING" != true ]]; then exit 1; fi
          echo "::warning::Live upstream discovery unavailable; the optional server artifact will not be included."
          echo '⚠️ Live upstream discovery was unavailable. This release contains the browser packages and userscript, but not the server-side artifact.' >> "$GITHUB_STEP_SUMMARY"

      - name: "🧩 Build current server-side patched edition"
        if: steps.upstream.outputs.verified == 'true'
        env:
          VERIFIED_SCRIPT: ${{ steps.upstream.outputs.script_url }}
          VERIFIED_SHA256: ${{ steps.upstream.outputs.sha256 }}
        run: npm run build:patched-upstream -- --script "$VERIFIED_SCRIPT" --expect-sha256 "$VERIFIED_SHA256"

      - name: "📸 Collect versioned release screenshots"
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          mkdir -p dist/release/screenshots
          for screenshot in docs/assets/comparison/"$RELEASE_TAG"-*.png; do
            if [[ -f "$screenshot" ]]; then cp "$screenshot" dist/release/screenshots/; fi
          done

      - name: "📝 Disclose omitted server artifact"
        env:
          UPSTREAM_VERIFIED: ${{ steps.upstream.outputs.verified }}
        run: |
          cp dist/release/RELEASE-NOTES.md dist/release/body.md
          if [[ "$UPSTREAM_VERIFIED" != true ]]; then
            printf '\n> The optional server-side artifact is not included because live discovery was unavailable on the release runner.\n' >> dist/release/body.md
          fi

      - name: "🔏 Attest release artifacts"
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: |
            soft98-pro.user.js
            dist/packages/*.zip
            dist/release/latest.json
            dist/release/SHA256SUMS.txt
            dist/release/RELEASE-NOTES.md
            dist/release/screenshots/*.png

      - name: "🔏 Attest the optional server-side artifact"
        if: steps.upstream.outputs.verified == 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: dist/upstream/*

      - name: "🚀 Publish GitHub Release"
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: "🏴‍☠️ Soft98 Pro ${{ steps.version.outputs.tag }}"
          body_path: dist/release/body.md
          prerelease: ${{ github.event.inputs.prerelease || false }}
          make_latest: true
          files: |
            dist/packages/soft98-pro-chromium-*.zip
            dist/packages/soft98-pro-firefox-*.zip
            dist/packages/soft98-pro-userscript-*.zip
            soft98-pro.user.js
            dist/release/latest.json
            dist/release/SHA256SUMS.txt
            dist/release/RELEASE-NOTES.md
            ${{ steps.upstream.outputs.verified == 'true' && 'dist/upstream/manifest.json' || '' }}
            ${{ steps.upstream.outputs.verified == 'true' && 'dist/upstream/soft98-application.patched.js' || '' }}
            CHANGELOG.md
            dist/release/screenshots/*.png

      - name: "🧾 Publish branded release summary"
        if: always() && hashFiles('dist/release/latest.json') != ''
        env:
          JOB_STATUS: ${{ job.status }}
        run: node tools/ci-summary.js release
