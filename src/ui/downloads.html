<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link id="manager-favicon" rel="icon" href="download-manager.svg">
    <link rel="stylesheet" href="typography.css">
    <link rel="stylesheet" href="theme.css">
    <script src="theme.js"></script>
    <link rel="stylesheet" href="downloads.css">
    <title>Soft98 Pro</title>
  </head>
  <body>
    <header class="masthead">
      <div class="masthead-inner">
        <div class="identity"><img id="manager-mark" src="download-manager.svg" alt="" width="40" height="40"><div><a id="pro-settings-link" href="options.html" target="_blank" rel="noopener">Soft98 Pro</a><h1 data-copy="title"></h1></div></div>
        <nav id="manager-nav" class="manager-nav">
          <a id="queue-tab" href="#queue"></a>
          <a id="settings-tab" href="#settings"></a>
          <a id="expand-manager" href="downloads.html" target="_blank" rel="noopener"></a>
        </nav>
      </div>
    </header>
    <main class="workspace">
      <section id="queue-view" class="queue" aria-labelledby="queue-title">
        <header class="queue-header">
          <div><h2 id="queue-title" data-copy="queue"></h2>
            <dl id="counts">
              <div><dt data-copy="active"></dt><dd id="count-active">0</dd></div>
              <div><dt data-copy="waiting"></dt><dd id="count-waiting">0</dd></div>
              <div><dt data-copy="finished"></dt><dd id="count-finished">0</dd></div>
            </dl>
          </div>
          <div class="controls">
            <button id="open-import" type="button" class="primary" aria-haspopup="dialog"></button>
            <button id="hold" type="button" disabled></button>
          </div>
        </header>
        <div class="filters">
          <label class="search"><span class="visually-hidden" data-copy="search"></span><input id="search" type="search"></label>
          <label><span class="visually-hidden" data-copy="filter"></span><select id="filter"></select></label>
        </div>
        <p id="notice" role="status"></p>
        <ul id="jobs" class="jobs"></ul>
        <div id="queue-empty" class="queue-empty">
          <span id="empty-icon" class="file-mark" aria-hidden="true"></span>
          <p id="empty"></p>
          <button id="empty-action" type="button" hidden></button>
        </div>
      </section>
      <section id="settings-view" class="settings" aria-labelledby="settings-title" hidden>
        <h2 id="settings-title" data-copy="settings"></h2>
        <div class="setting-row"><label for="limit" data-copy="parallel"></label><select id="limit" disabled></select></div>
        <div class="setting-row"><label for="native-notifications" data-copy="nativeNotifications"></label><input id="native-notifications" type="checkbox" disabled></div>
        <div class="setting-row"><label for="date-calendar" data-copy="dateCalendar"></label><select id="date-calendar" disabled></select></div>
        <div class="setting-row"><span data-copy="history"></span><button id="clear" type="button" disabled></button></div>
      </section>
      <output id="feedback" role="status"></output>
      <footer class="manager-footer"><a id="guide-link" href="#guide" data-copy="managerGuide"></a><a href="https://t.me/PersianBlocker/1/27859" data-copy="community" target="_blank" rel="noopener noreferrer"></a></footer>
    </main>
    <dialog id="import" aria-labelledby="import-title">
      <form id="composer">
        <header class="import-bar">
          <h2 id="import-title" data-copy="importTitle"></h2>
          <button id="close-import" class="icon-button" type="button"></button>
        </header>
        <div class="import-inputs">
          <label class="visually-hidden" for="import-url" data-copy="urls"></label>
          <input id="import-url" dir="ltr" type="url" maxlength="4096" placeholder="https://" autofocus>
          <button id="add-url" type="button"></button>
          <button id="paste-links" type="button"></button>
          <button id="choose-file" type="button"></button>
          <input id="import-file" type="file" accept=".txt,text/plain" hidden>
        </div>
        <div class="import-filters">
          <label class="search"><span class="visually-hidden" data-copy="search"></span><input id="import-search" type="search"></label>
          <select id="import-type" aria-label=""></select>
          <button id="select-import" type="button" data-copy="selectVisible"></button>
          <button id="clear-import" type="button" data-copy="deselectAll"></button>
          <button id="probe-import" type="button"></button>
        </div>
        <div class="import-grid" tabindex="0" role="region" aria-labelledby="import-title">
          <table id="import-table">
            <colgroup><col class="checkbox-col"><col data-column="name"><col data-column="type"><col data-column="size"><col data-column="date"></colgroup>
            <thead><tr><th scope="col" aria-label="" id="check-column">✓</th><th scope="col" data-column="name"></th><th scope="col" data-column="type"></th><th scope="col" data-column="size"></th><th scope="col" data-column="date"></th></tr></thead>
            <tbody id="import-links"></tbody>
          </table>
          <p id="import-empty" class="empty" data-copy="importEmpty"></p>
        </div>
        <p id="import-notice" role="status"></p>
        <details>
          <summary data-copy="saveOptions"></summary>
          <label for="filename" data-copy="path"></label>
          <input id="filename" dir="ltr" type="text" maxlength="240" placeholder="Tools/file.zip">
          <label class="check"><input id="save-as" type="checkbox"><span data-copy="saveAs"></span></label>
        </details>
        <footer class="import-bar">
          <span id="import-count" aria-live="polite"></span>
          <button id="add" type="submit" class="primary" disabled></button>
        </footer>
      </form>
    </dialog>
    <dialog id="guide" class="guide" aria-labelledby="guide-title">
      <div class="guide-body">
        <header class="import-bar"><h2 id="guide-title" data-copy="managerGuide"></h2><button id="close-guide" class="icon-button" type="button"></button></header>
        <dl>
          <div><dt data-copy="importOpen"></dt><dd data-copy="guideImport"></dd></div>
          <div><dt data-copy="queue"></dt><dd data-copy="guideQueue"></dd></div>
          <div><dt data-copy="settings"></dt><dd data-copy="guideSettings"></dd></div>
        </dl>
      </div>
    </dialog>
    <div id="manager-menu" class="context-menu" role="menu" popover="manual"></div>
    <script src="download-links.js"></script>
    <script src="download-view.js"></script>
    <script src="download-import.js"></script>
    <script src="downloads.js"></script>
  </body>
</html>
