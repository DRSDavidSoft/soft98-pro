<script src="/src/linkdoni.js"></script>
<script>
  let dark = true;
  const icon = '<svg viewBox="0 0 24 24"><path d="M1 1h10"/></svg>';
  const icons = Object.fromEntries(["rss","search","external","home","moon","sun","chevron","chevronRight"].map(name => [name, icon]));
  const fixture = Soft98Linkdoni.create(document, {
    icons, locale: "fa", text: (key, values) => values ? values.count + " لینک" : key,
    changeTheme: () => {
      dark = !dark;
      document.documentElement.classList.toggle("soft98-pro-light", !dark);
      fixture.sync({ enabled: true, dark });
    },
  });
  fixture.sync({ enabled: true, dark });
  window.restoreLinkdoni = () => fixture.sync({ enabled: false, dark });
</script>
